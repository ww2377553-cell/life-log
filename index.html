<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的生活记录</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #faf6ef;
    --warm: #f0e8d8;
    --accent: #c8603a;
    --accent2: #4a7c6f;
    --muted: #8a7e6e;
    --border: #ddd5c4;
    --like-bg: #f0f7f4;
    --like-border: #4a7c6f;
    --nope-bg: #fdf3ef;
    --nope-border: #c8603a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(200,96,58,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(74,124,111,0.06) 0%, transparent 50%);
  }

  header {
    padding: 40px 32px 24px;
    border-bottom: 1px solid var(--border);
    max-width: 960px;
    margin: 0 auto;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .date-tag {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }

  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 24px;
  }

  /* Journal Section - spans full width */
  .journal-section {
    grid-column: 1 / -1;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .section-label {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--ink);
    background: var(--paper);
    resize: vertical;
    min-height: 130px;
    transition: border-color 0.2s;
    outline: none;
  }

  textarea:focus {
    border-color: var(--accent2);
    background: white;
  }

  textarea::placeholder {
    color: #bbb0a0;
  }

  .journal-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 14px;
    gap: 12px;
  }

  .char-hint {
    font-size: 12px;
    color: var(--muted);
  }

  .analyze-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .analyze-btn:hover:not(:disabled) {
    background: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(200,96,58,0.3);
  }

  .analyze-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Analysis Result */
  .analysis-result {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #fff9f0 0%, #f8fff8 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 28px;
    display: none;
    animation: fadeSlideIn 0.4s ease;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .analysis-text {
    font-size: 14px;
    line-height: 1.9;
    color: var(--muted);
    white-space: pre-wrap;
  }

  /* Lists */
  .list-section {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    min-height: 280px;
  }

  .list-section.likes { border-top: 3px solid var(--like-border); }
  .list-section.nopes { border-top: 3px solid var(--nope-border); }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .list-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .likes .list-title { color: var(--like-border); }
  .nopes .list-title { color: var(--nope-border); }

  .count-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .likes .count-badge { background: var(--like-bg); color: var(--like-border); }
  .nopes .count-badge { background: var(--nope-bg); color: var(--nope-border); }

  .item-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .item-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
    animation: popIn 0.3s ease;
    position: relative;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .likes .item-card { background: var(--like-bg); }
  .nopes .item-card { background: var(--nope-bg); }

  .item-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }

  .likes .item-dot { background: var(--like-border); }
  .nopes .item-dot { background: var(--nope-border); }

  .item-text { flex: 1; color: var(--ink); }

  .item-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0 2px;
    transition: color 0.15s;
    flex-shrink: 0;
  }

  .delete-btn:hover { color: var(--accent); }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: #c5bdb0;
    font-size: 13px;
    line-height: 2;
  }

  .empty-icon { font-size: 28px; margin-bottom: 8px; }

  /* History */
  .history-section {
    grid-column: 1 / -1;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 4px;
  }

  .history-entry {
    padding: 12px 16px;
    background: var(--warm);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    border-left: 3px solid var(--border);
    position: relative;
  }

  .history-entry-date {
    font-size: 11px;
    color: #aaa;
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }

  .history-entry-text {
    color: var(--ink);
    font-weight: 300;
  }

  .error-msg {
    background: #fff0f0;
    border: 1px solid #fcc;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #c0392b;
    margin-top: 12px;
    display: none;
  }

  @media (max-width: 640px) {
    .main { grid-template-columns: 1fr; padding: 16px; }
    .list-section { grid-column: 1; }
    header { padding: 24px 16px 16px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>我的生活记录</h1>
    <span class="date-tag" id="today-date"></span>
  </div>
  <p class="subtitle">记录每一天，让 AI 帮你整理喜好与踩雷</p>
</header>

<div class="main">

  <!-- Journal Input -->
  <div class="journal-section">
    <div class="section-label">今日记录</div>
    <textarea id="journal-input" placeholder="随意写下今天发生的事，比如：今天午饭吃了螺蛳粉，觉得很好吃，下次还想买。晚饭点的那家黄焖鸡，汤汁太甜了，感觉一般，不太会再点了。还喝了一杯生椰拿铁，椰奶味很浓，很喜欢……"></textarea>
    <div class="error-msg" id="error-msg"></div>
    <div class="journal-footer">
      <span class="char-hint" id="char-count">0 字</span>
      <button class="analyze-btn" id="analyze-btn" onclick="analyzeEntry()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">✦ AI 分析</span>
      </button>
    </div>
  </div>

  <!-- AI Analysis Result -->
  <div class="analysis-result" id="analysis-result">
    <div class="section-label">AI 解读</div>
    <div class="analysis-text" id="analysis-text"></div>
  </div>

  <!-- Likes List -->
  <div class="list-section likes">
    <div class="list-header">
      <div class="list-title">💚 爱吃 / 好物</div>
      <span class="count-badge" id="likes-count">0</span>
    </div>
    <ul class="item-list" id="likes-list">
      <li>
        <div class="empty-state">
          <div class="empty-icon">🌿</div>
          还没有记录<br>写下你的第一条日记吧
        </div>
      </li>
    </ul>
  </div>

  <!-- Nopes List -->
  <div class="list-section nopes">
    <div class="list-header">
      <div class="list-title">🚫 踩雷 / 不再买</div>
      <span class="count-badge" id="nopes-count">0</span>
    </div>
    <ul class="item-list" id="nopes-list">
      <li>
        <div class="empty-state">
          <div class="empty-icon">🍂</div>
          还没有踩雷记录<br>好事！
        </div>
      </li>
    </ul>
  </div>

  <!-- History -->
  <div class="history-section" id="history-section" style="display:none">
    <div class="section-label">历史记录</div>
    <div class="history-list" id="history-list"></div>
  </div>

</div>

<script>
// State
const state = {
  likes: JSON.parse(localStorage.getItem('life_likes') || '[]'),
  nopes: JSON.parse(localStorage.getItem('life_nopes') || '[]'),
  history: JSON.parse(localStorage.getItem('life_history') || '[]')
};

function save() {
  localStorage.setItem('life_likes', JSON.stringify(state.likes));
  localStorage.setItem('life_nopes', JSON.stringify(state.nopes));
  localStorage.setItem('life_history', JSON.stringify(state.history));
}

// Date
document.getElementById('today-date').textContent = new Date().toLocaleDateString('zh-CN', {
  year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
});

// Char count
document.getElementById('journal-input').addEventListener('input', function() {
  document.getElementById('char-count').textContent = this.value.length + ' 字';
});

// Render
function renderLikes() {
  const el = document.getElementById('likes-list');
  document.getElementById('likes-count').textContent = state.likes.length;
  if (!state.likes.length) {
    el.innerHTML = `<li><div class="empty-state"><div class="empty-icon">🌿</div>还没有记录<br>写下你的第一条日记吧</div></li>`;
    return;
  }
  el.innerHTML = state.likes.map((item, i) => `
    <li class="item-card">
      <div class="item-dot"></div>
      <div style="flex:1">
        <div class="item-text">${escHtml(item.name)}</div>
        ${item.reason ? `<div class="item-meta">${escHtml(item.reason)}</div>` : ''}
        <div class="item-meta">${item.date}</div>
      </div>
      <button class="delete-btn" onclick="deleteItem('likes',${i})" title="删除">×</button>
    </li>`).join('');
}

function renderNopes() {
  const el = document.getElementById('nopes-list');
  document.getElementById('nopes-count').textContent = state.nopes.length;
  if (!state.nopes.length) {
    el.innerHTML = `<li><div class="empty-state"><div class="empty-icon">🍂</div>还没有踩雷记录<br>好事！</div></li>`;
    return;
  }
  el.innerHTML = state.nopes.map((item, i) => `
    <li class="item-card">
      <div class="item-dot"></div>
      <div style="flex:1">
        <div class="item-text">${escHtml(item.name)}</div>
        ${item.reason ? `<div class="item-meta">${escHtml(item.reason)}</div>` : ''}
        <div class="item-meta">${item.date}</div>
      </div>
      <button class="delete-btn" onclick="deleteItem('nopes',${i})" title="删除">×</button>
    </li>`).join('');
}

function renderHistory() {
  const sec = document.getElementById('history-section');
  const el = document.getElementById('history-list');
  if (!state.history.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  el.innerHTML = state.history.slice().reverse().map(h => `
    <div class="history-entry">
      <div class="history-entry-date">${h.date}</div>
      <div class="history-entry-text">${escHtml(h.text)}</div>
    </div>`).join('');
}

function deleteItem(list, idx) {
  state[list].splice(idx, 1);
  save();
  list === 'likes' ? renderLikes() : renderNopes();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// AI Analysis
async function analyzeEntry() {
  const input = document.getElementById('journal-input').value.trim();
  if (!input) {
    showError('请先写下今天的记录～');
    return;
  }
  if (input.length < 10) {
    showError('多写一点，让 AI 更好地理解你的感受 😊');
    return;
  }

  setLoading(true);
  hideError();

  const today = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });

  const prompt = `你是一个帮用户整理个人喜好的助手。请认真分析以下用户今天写的生活记录，提取其中提到的食物、产品或事物，判断用户对它们的态度，分成两类：
1. 喜欢/愿意再买/好的体验（likes）
2. 不喜欢/不会再买/踩雷（nopes）

用户记录：
${input}

请只返回如下JSON格式，不要任何解释或多余文字：
{
  "summary": "一句话总结这段记录的核心内容（20字以内）",
  "likes": [
    {"name": "物品名称", "reason": "简短原因（10字内）"}
  ],
  "nopes": [
    {"name": "物品名称", "reason": "简短原因（10字内）"}
  ]
}

注意：
- 如果某类没有，对应数组留空 []
- reason 如果没有明确理由可以留空字符串
- name 要具体，比如"螺蛳粉"而不是"食物"`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();

    if (data.error) {
      showError('AI 暂时无法响应：' + (data.error.message || '未知错误'));
      setLoading(false);
      return;
    }

    const rawText = data.content.map(b => b.text || '').join('');
    let parsed;

    try {
      const clean = rawText.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    } catch(e) {
      showError('AI 返回格式有误，请重试');
      setLoading(false);
      return;
    }

    // Show summary
    const resultEl = document.getElementById('analysis-result');
    const textEl = document.getElementById('analysis-text');
    resultEl.style.display = 'block';

    let summary = parsed.summary || '已分析完成';
    let detail = `✦ ${summary}\n\n`;
    if (parsed.likes?.length) detail += `💚 发现 ${parsed.likes.length} 个好物：${parsed.likes.map(i=>i.name).join('、')}\n`;
    if (parsed.nopes?.length) detail += `🚫 发现 ${parsed.nopes.length} 个踩雷：${parsed.nopes.map(i=>i.name).join('、')}`;
    if (!parsed.likes?.length && !parsed.nopes?.length) detail += '这段记录里没有明显的喜好信息，可以多描述一下感受哦～';

    textEl.textContent = detail.trim();

    // Add to lists
    const dateStr = today;
    if (parsed.likes?.length) {
      parsed.likes.forEach(item => {
        if (!state.likes.find(e => e.name === item.name)) {
          state.likes.push({ name: item.name, reason: item.reason || '', date: dateStr });
        }
      });
    }
    if (parsed.nopes?.length) {
      parsed.nopes.forEach(item => {
        if (!state.nopes.find(e => e.name === item.name)) {
          state.nopes.push({ name: item.name, reason: item.reason || '', date: dateStr });
        }
      });
    }

    // Save to history
    state.history.push({
      date: new Date().toLocaleString('zh-CN', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }),
      text: input
    });

    save();
    renderLikes();
    renderNopes();
    renderHistory();

    document.getElementById('journal-input').value = '';
    document.getElementById('char-count').textContent = '0 字';

  } catch(err) {
    showError('网络错误，请稍后重试');
  }

  setLoading(false);
}

function setLoading(on) {
  const btn = document.getElementById('analyze-btn');
  const spinner = document.getElementById('spinner');
  const txt = document.getElementById('btn-text');
  btn.disabled = on;
  spinner.style.display = on ? 'block' : 'none';
  txt.textContent = on ? '分析中…' : '✦ AI 分析';
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}

// Init
renderLikes();
renderNopes();
renderHistory();
</script>
</body>
</html>
